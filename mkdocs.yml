# The handbook site, built from docs/ with MkDocs and the Material theme (requirements-docs.txt pins them). The docs workflow
# builds it with --strict on every pull request and publishes it to GitHub Pages on every merge to master.
site_name: NWN Landscaper
site_description: Draw terrain in your browser and get a Neverwinter Nights area. The builder's handbook.
site_url: https://plenarius.github.io/nwn-landscaper/
repo_url: https://github.com/plenarius/nwn-landscaper
repo_name: plenarius/nwn-landscaper
edit_uri: edit/master/docs/
copyright: Copyright (C) 2026 plenarius. GPL-3.0-or-later.

docs_dir: docs
strict: true

theme:
  name: material
  icon:
    logo: material/terrain
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - glightbox:
      skip_classes:
        - no-lightbox

# Links between pages and to headings must resolve, or the strict build fails the pull request.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Rewrites links to files outside docs/ (the README, packs/) into links to them on GitHub, and draws the showcase.
hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Handbook:
      - handbook/index.md
      - Getting started: handbook/getting-started.md
      - Terrain: handbook/terrain.md
      - Paint and the mix brush: handbook/paint.md
      - Caves and interiors: handbook/caves.md
      - Scatter and Place: handbook/scatter.md
      - Things: handbook/things.md
      - Light: handbook/light.md
      - Ambience: handbook/ambience.md
      - Atmosphere and skies: handbook/atmosphere.md
      - Texture packs: handbook/texture-packs.md
      - Export: handbook/export.md
      - Publish and teams: handbook/publish.md
      - The whole path: BUILDER-WORKFLOW.md
  - Showcase: showcase.md
  - Running it:
      - On your machine or a server: SELF-HOSTING.md
      - Configuration: CONFIGURATION.md
      - The team server: TEAM-SERVER.md
      - The review service: REVIEW-SERVICE.md
      - Real Skies for modules: REAL-SKIES.md
      - Sky packs: SKY-PACKS.md
      - Preset skies: PRESET-SKIES.md
      - Texture packs: TEXTURE-PACKS.md
      - Debugging switches: DEBUGGING.md
  - Internals:
      - Areas that look alive: DESIGN-ambience.md
      - Cut into pieces: DESIGN-canvas-cut.md
      - In a browser: DESIGN-web-demo.md
