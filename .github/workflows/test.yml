name: Tests

# Runs the tests of the Landscaper's workspace on every pull request to master. They need no Neverwinter Nights install.
# nwn-bake, a git dependency at a release tag, is tested in its own repository (https://github.com/plenarius/nwn-bake, on
# three platforms); tests/nwn_bake_split.rs here checks that the Landscaper pins the same Moonglow and the same shared files.
# Linux and Windows (until 0.2.2 they ran on Linux only, and every export on Windows failed). Formatting, lints and the other
# checks of STYLE.md run in check.yml (scripts/check.sh).
# A pull request that changes only docs and Markdown skips the build but still reports `test`, since the ruleset requires it.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  test:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      # (Steps, not the job, skip: a skipped matrix job reports under an unexpanded name the ruleset never sees.)
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (stable)
        if: needs.changes.outputs.code == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable && rustc --version
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The app's Linux packages (WebKitGTK)
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev >/dev/null
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --locked --no-run
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --locked --no-fail-fast
