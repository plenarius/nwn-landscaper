name: Packages

# When a version's release is published (by hand, release.yml), the package managers get it: the Homebrew cask in
# plenarius/homebrew-tap takes the version and the .dmg's sha256 from SHA256SUMS, in a commit, and winget gets a pull request to
# microsoft/winget-pkgs for the new version from komac. Both need PACKAGES_TOKEN, a classic token with public_repo: komac can't
# open winget's pull request with a fine-grained one (russellbanks/Komac#310). Without the secret, each job says so and stops.
#
# Run by hand with a tag (v0.7.4) to redo a release's packages; a cask already at that version and a winget version already
# there are left alone.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (v0.7.4)"
        required: true

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.which.outputs.version }}
    steps:
      - name: Which release
        id: which
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          set -eu
          # Version tags only: the other releases (showcase, demo-stock) hold files for the site, not the program.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$PRERELEASE" = true ]; then
            echo "::notice::$TAG is not a version's release: no packages"
            exit 0
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  homebrew:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: PACKAGES_TOKEN
        id: token
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "::warning::PACKAGES_TOKEN is not set: the Homebrew cask stays as it is"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The .dmg's sha256
        if: steps.token.outputs.ok
        id: sum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          dmg="nwn-landscaper-$VERSION-macos-universal.dmg"
          sha=$(awk -v f="$dmg" '$2 == f || $2 == "*" f { print $1 }' "$RUNNER_TEMP/SHA256SUMS")
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "SHA256SUMS has no line for $dmg" >&2; exit 1; }
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.ok
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: plenarius/homebrew-tap
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: tap
      - name: Bump Casks/nwn-landscaper.rb
        if: steps.token.outputs.ok
        working-directory: tap
        env:
          SHA256: ${{ steps.sum.outputs.sha256 }}
        run: |
          set -euo pipefail
          cask=Casks/nwn-landscaper.rb
          sed -i -E "s/^  version \"[^\"]*\"$/  version \"$VERSION\"/; s/^  sha256 \"[0-9a-f]{64}\"$/  sha256 \"$SHA256\"/" "$cask"
          grep -qx "  version \"$VERSION\"" "$cask" && grep -qx "  sha256 \"$SHA256\"" "$cask" \
            || { echo "$cask has no version or sha256 line to change" >&2; exit 1; }
          if git diff --quiet; then
            echo "::notice::The cask is already at $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "nwn-landscaper $VERSION"
          git push origin HEAD
          echo "The cask is at $VERSION"

  winget:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.release.outputs.version }}
      PACKAGE: Plenarius.NWNLandscaper
      KOMAC_NO_UPDATE_NOTIFIER: "1"
    steps:
      - name: PACKAGES_TOKEN
        id: token
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "::warning::PACKAGES_TOKEN is not set: no winget pull request for $VERSION"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: komac
        if: steps.token.outputs.ok
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o komac.tgz https://github.com/russellbanks/Komac/releases/download/v2.17.2/komac-2.17.2-x86_64-unknown-linux-gnu.tar.gz
          echo "b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966  komac.tgz" | sha256sum -c
          mkdir x && tar -xzf komac.tgz -C x
          install -m 755 "$(find x -type f -name komac | head -n 1)" /usr/local/bin/komac
          komac --version
      - name: The pull request to winget-pkgs
        if: steps.token.outputs.ok
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          # komac adds a version to a package winget-pkgs has: until the first version's pull request is merged, there is none.
          if ! versions=$(komac list "$PACKAGE" 2> "$RUNNER_TEMP/list.err"); then
            cat "$RUNNER_TEMP/list.err" >&2
            grep -q "does not exist" "$RUNNER_TEMP/list.err" || exit 1
            echo "::warning::$PACKAGE is not in winget-pkgs yet: no pull request for $VERSION"
            exit 0
          fi
          if grep -qx "$VERSION" <<< "$versions"; then
            echo "::notice::winget-pkgs already has $PACKAGE $VERSION"
            exit 0
          fi
          komac update "$PACKAGE" --version "$VERSION" \
            --urls "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/nwn-landscaper-$VERSION-windows-x86_64-setup.exe" \
            --release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            --submit
