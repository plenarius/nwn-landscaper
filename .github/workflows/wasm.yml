name: WebAssembly

# The engine built for the browser (scripts/build-wasm.sh, docs/DESIGN-web-demo.md), on every pull request that could change it:
# it must build for WASI and stay under its size limit (scripts/wasm-size.mjs). release.yml calls it for landscaper-wasm.zip.
on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
      - name: Build (and its size)
        run: scripts/build-wasm.sh
      - name: landscaper-wasm.zip
        run: |
          set -eu
          mkdir -p dist/landscaper-wasm
          cp target/wasm32-wasip1/wasm/landscaper.wasm LICENSE dist/landscaper-wasm/
          cp scripts/wasm/NOTICE.md dist/landscaper-wasm/README.md
          (cd dist && zip -qr landscaper-wasm.zip landscaper-wasm && ls -l landscaper-wasm.zip)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: dist/landscaper-wasm.zip
