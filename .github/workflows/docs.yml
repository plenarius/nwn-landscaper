name: docs

# The handbook site (mkdocs.yml). Every pull request to master builds it with --strict, so a dead link, a missing heading or a
# page left out of the nav fails the check. A merge to master builds it again and publishes it to GitHub Pages, with /try/, the
# Landscaper in the browser (scripts/try-page.sh).
on:
  pull_request:
    branches: [master]
    paths: [docs/**, mkdocs.yml, requirements-docs.txt, scripts/mkdocs_hooks.py, scripts/try-page.sh, scripts/pack-showcase.sh, packs/demo/**, .github/workflows/docs.yml]
  push:
    branches: [master]
    paths: [docs/**, mkdocs.yml, requirements-docs.txt, scripts/mkdocs_hooks.py, scripts/try-page.sh, scripts/pack-showcase.sh, packs/demo/**, .github/workflows/docs.yml]
  # A published release brings a new landscaper-wasm.zip for /try/. Its Release run ends while the release is still a draft,
  # which /try/ can't see, so publishing it starts a build of master (the job "republish", below).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A release event runs on its tag; the site is master's, so start the build there.
  republish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref master

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    # (Until a release has landscaper-wasm.zip, /try/ builds the engine: about 5 minutes.)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # The showcase clips: files on the "showcase" release, copied into the site so Pages serves them as video (a release
      # serves them as downloads). Not in the repository; a missing release leaves the cards with their stills.
      - name: Showcase clips
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download showcase --repo "$GITHUB_REPOSITORY" --pattern '*.mp4' --dir docs/assets/showcase/clips || echo "no showcase release"
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      # The Rust the engine's fallback build needs (scripts/try-page.sh), with the wasm job's cache.
      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
          save-if: false
      # /try/: the engine of the newest release with landscaper-wasm.zip and the editor at its tag (else built here, with the
      # editor's main). The page needs no header Pages can't send: it uses no threads, so no cross-origin isolation.
      - name: The page in the browser (/try/)
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: scripts/try-page.sh site/try
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # (Only master's site: a run started by hand on another branch builds it without publishing it.)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
